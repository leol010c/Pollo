<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#070c11" />
    <meta name="description" content="Two physics dice: one says what, one says where. Throw them, and they decide." />
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <title>Pollo</title>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@75..125,400..700&family=DM+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="table" class="table" aria-hidden="true"></canvas>

    <header class="mark">
      <span class="mark__word">Pollo</span>
      <div class="switch" id="dice-switch" role="group" aria-label="How many dice">
        <button class="switch__opt" id="one-die" type="button" aria-pressed="true">One die</button>
        <button class="switch__opt" id="two-dice" type="button" aria-pressed="false">Two dice</button>
      </div>
    </header>

    <div class="prompt" id="prompt">
      <button class="button" id="throw" type="button">Throw</button>
      <p class="prompt__hint">or tap the table</p>
    </div>

    <section
      class="plate"
      id="plate"
      data-open="false"
      data-where="asking"
      data-up="false"
      aria-live="polite"
    >
      <ol class="strip" id="strip" aria-hidden="true"></ol>

      <figure class="card card--what" id="card-what">
        <div class="card__face">
          <span class="cluster card__pips" id="what-pips" aria-hidden="true"></span>
          <img class="card__art" id="plate-art" alt="" width="252" height="251" />
        </div>
      </figure>

      <div class="plate__words">
        <h2 class="plate__name" id="plate-name"></h2>
        <p class="plate__line" id="plate-line"></p>
      </div>

      <p class="where__label">Where</p>

      <figure class="card card--where" id="card-where">
        <div class="card__face">
          <span class="cluster card__pips" id="where-pips" aria-hidden="true"></span>
          <span class="card__word" id="where-name"></span>
        </div>
      </figure>

      <p class="where__line" id="where-line"></p>

      <div class="actions">
        <button class="button button--strong" id="roll-where" type="button">Roll for where</button>
        <button class="button" id="again" type="button">Throw again</button>
        <button class="button button--quiet" id="lay" type="button">Lay it down</button>
      </div>
    </section>

    <noscript class="noscript">
      This is a die you throw. It needs JavaScript to fall over.
    </noscript>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
